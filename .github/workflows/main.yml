name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project WorkoutTimer/WorkoutTimer.xcodeproj \
            -scheme WorkoutTimer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=$PWD/build \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/WorkoutTimer.app Payload/
          zip -r WorkoutTimer.ipa Payload
          echo "IPA created: $(du -sh WorkoutTimer.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutTimer-IPA
          path: WorkoutTimer.ipa
          retention-days: 30
