name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s /Applications/$XCODE

      - name: Show Xcode version
        run: xcodebuild -version
        
      - name: List schemes
        run: xcodebuild -project WorkoutTimerXcode/WorkoutTimer/WorkoutTimer.xcodeproj -list

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project WorkoutTimerXcode/WorkoutTimer/WorkoutTimer.xcodeproj \
            -scheme WorkoutTimer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR=$PWD/build \
            clean build
        
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/WorkoutTimer.app Payload/
          zip -r WorkoutTimer.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutTimer-IPA
          path: WorkoutTimer.ipa
          retention-days: 30
